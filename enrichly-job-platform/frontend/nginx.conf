server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular client-side routing: any path that isn't a real file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # Static assets can be cached aggressively; index.html/env.js above are excluded on purpose.
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
